<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estante Literária</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #120e0c;
      --card-bg: #221a16;
      --card-border: #362923;
      --input-bg: #1a1310;
      --text-main: #eae4dc;
      --text-muted: #a6988a;
      --accent-gold: #c89f68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .hero-banner {
      height: 180px;
      background-image: linear-gradient(to bottom, rgba(18, 14, 12, 0.4), rgba(18, 14, 12, 0.95)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      margin-bottom: 20px;
    }

    .hero-subtitle { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-gold); font-weight: 600; }
    .hero-title { font-family: 'Merriweather', serif; font-size: 1.8rem; font-weight: 700; color: #fff; margin-top: 4px; }

    .container { max-width: 500px; margin: 0 auto; padding: 0 16px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin-top: 4px; }

    .metas-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .meta-item { margin-bottom: 10px; }
    .meta-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }

    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; }
    .filter-btn.active { background: var(--accent-gold); color: #120e0c; font-weight: 700; border-color: var(--accent-gold); }

    .form-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    input[type="text"], input[type="number"], select, input[type="file"] {
      width: 100%; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 0.85rem; outline: none;
    }

    input[type="file"]::file-selector-button {
      background: var(--card-border);
      color: var(--accent-gold);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    button { cursor: pointer; touch-action: manipulation; }
    .btn-submit { width: 100%; background-color: var(--accent-gold); color: #120e0c; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 0.9rem; margin-top: 10px; }

    .books-grid { display: flex; flex-direction: column; gap: 12px; }
    .book-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; display: flex; gap: 12px; }
    .book-cover { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background-color: var(--input-bg); flex-shrink: 0; }
    .book-info { flex: 1; min-width: 0; }
    .book-title-item { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .book-author { font-size: 0.8rem; color: var(--text-muted); }
    .book-genre { font-size: 0.7rem; color: var(--accent-gold); margin-bottom: 6px; }

    .progress-bar { height: 6px; background-color: var(--input-bg); border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; background-color: var(--accent-gold); width: 0%; }

    .book-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-action { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); font-size: 0.75rem; padding: 8px 12px; border-radius: 6px; }
    .btn-action.accent { border-color: var(--accent-gold); color: var(--accent-gold); }

    /* MODAL EDIÇÃO */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; padding: 20px; overflow-y: auto; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.6rem; }
  </style>
</head>
<body>

  <div class="hero-banner">
    <div class="container" style="padding:0; width:100%;">
      <span class="hero-subtitle">Sua Biblioteca Pessoal</span>
      <h1 class="hero-title">Estante Literária</h1>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Páginas Lidas</div><div class="stat-value" id="stat-paginas">0</div></div>
      <div class="stat-card"><div class="stat-label">Em Andamento</div><div class="stat-value" id="stat-lendo">0</div></div>
      <div class="stat-card"><div class="stat-label">Livros Concluídos</div><div class="stat-value" id="stat-concluidos">0</div></div>
      <div class="stat-card"><div class="stat-label">Total Cadastrado</div><div class="stat-value" id="stat-total">0</div></div>
    </div>

    <div class="metas-card">
      <div class="meta-item">
        <div class="meta-header"><span>Meta Mensal</span><span id="meta-m-texto">0/0 livros</span></div>
        <div class="progress-bar"><div class="progress-fill" id="meta-m-bar"></div></div>
      </div>
      <div class="meta-item" style="margin-top:10px;">
        <div class="meta-header"><span>Meta Anual</span><span id="meta-a-texto">0/0 livros</span></div>
        <div class="progress-bar"><div class="progress-fill" id="meta-a-bar"></div></div>
      </div>
      <button class="btn-action accent" style="width:100%; margin-top:10px;" id="btn-metas">Ajustar Metas</button>
    </div>

    <input type="text" id="busca" placeholder="🔎 Pesquisar livro ou autor..." style="margin-bottom: 12px;">
    
    <div class="filter-scroll">
      <button class="filter-btn active" data-cat="todos">Todos</button>
      <button class="filter-btn" data-cat="Lendo">Lendo</button>
      <button class="filter-btn" data-cat="Quero ler">Quero ler</button>
      <button class="filter-btn" data-cat="Concluídos">Concluídos</button>
      <button class="filter-btn" data-cat="Pausados">Pausados</button>
      <button class="filter-btn" data-cat="Abandonados">Abandonados</button>
    </div>

    <div class="form-card">
      <h2 style="font-family:'Merriweather'; font-size:1rem; margin-bottom:12px;">Cadastrar Novo Livro</h2>
      
      <div class="form-group">
        <label>Título *</label>
        <input type="text" id="titulo" placeholder="Ex.: O Cemitério">
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Autor</label>
          <input type="text" id="autor" placeholder="Nome do autor">
        </div>
        <div class="form-group">
          <label>Gênero</label>
          <input type="text" id="genero" placeholder="Ex.: Terror, Romance">
        </div>
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Total Páginas</label>
          <input type="number" id="totalPaginas" placeholder="320">
        </div>
        <div class="form-group">
          <label>Página Atual</label>
          <input type="number" id="paginaAtual" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>Status / Categoria</label>
        <select id="categoria">
          <option value="Quero ler">Quero ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausados">Pausados</option>
          <option value="Abandonados">Abandonados</option>
          <option value="Concluídos">Concluídos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Escolher Capa da Galeria</label>
        <input type="file" id="capaArquivo" accept="image/*">
      </div>

      <button class="btn-submit" id="btn-adicionar">Adicionar à Estante</button>
    </div>

    <h2 style="font-family:'Merriweather'; font-size:1.1rem; margin-bottom:12px;">Meus Livros</h2>
    <div class="books-grid" id="lista-livros"></div>
  </div>

  <!-- MODAL EDIÇÃO -->
  <div class="modal" id="modalLivro">
    <div class="modal-content">
      <button class="close-modal" id="btn-fechar-modal">&times;</button>
      <h3 style="font-family:'Merriweather'; margin-bottom:12px;">Editar / Detalhes</h3>
      
      <input type="hidden" id="mod-id">
      
      <div class="form-group"><label>Título</label><input type="text" id="mod-titulo"></div>
      <div class="input-row">
        <div class="form-group"><label>Autor</label><input type="text" id="mod-autor"></div>
        <div class="form-group"><label>Gênero</label><input type="text" id="mod-genero"></div>
      </div>
      
      <div class="input-row">
        <div class="form-group"><label>Total Páginas</label><input type="number" id="mod-total"></div>
        <div class="form-group"><label>Página Atual</label><input type="number" id="mod-atual"></div>
      </div>

      <div class="form-group">
        <label>Status / Categoria</label>
        <select id="mod-categoria">
          <option value="Quero ler">Quero ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausados">Pausados</option>
          <option value="Abandonados">Abandonados</option>
          <option value="Concluídos">Concluídos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Trocar Capa pela Galeria</label>
        <input type="file" id="mod-capaArquivo" accept="image/*">
      </div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn-submit" id="btn-salvar-edicao">Salvar Alterações</button>
        <button class="btn-submit" style="background:#8a3b3b; color:#fff;" id="btn-excluir-modal">Excluir Livro</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      let biblioteca = JSON.parse(localStorage.getItem('estante_v4')) || [];
      let metas = JSON.parse(localStorage.getItem('estante_metas_v4')) || { mensal: 2, anual: 24 };
      let categoriaAtual = 'todos';
      let capaBase64Temp = '';

      // FUNÇÃO PARA COMPRIMIR IMAGENS DA GALERIA
      function comprimirImagem(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            callback(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // SELEÇÃO DE CAPA NO CADASTRO
      document.getElementById('capaArquivo').addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
          comprimirImagem(e.target.files[0], function(base64) {
            capaBase64Temp = base64;
          });
        }
      });

      // BUSCA AUTOMÁTICA DE CAPA
      document.getElementById('titulo').addEventListener('blur', async function() {
        const titulo = this.value.trim();
        if (!titulo || capaBase64Temp) return;

        try {
          const res = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(titulo));
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            const info = data.items[0].volumeInfo;
            if (info.imageLinks && info.imageLinks.thumbnail) {
              capaBase64Temp = info.imageLinks.thumbnail.replace('http://', 'https://');
            }
            if (info.authors && !document.getElementById('autor').value) {
              document.getElementById('autor').value = info.authors.join(', ');
            }
            if (info.pageCount && !document.getElementById('totalPaginas').value) {
              document.getElementById('totalPaginas').value = info.pageCount;
            }
          }
        } catch (err) {}
      });

      // ADICIONAR LIVRO
      document.getElementById('btn-adicionar').addEventListener('click', function(e) {
        e.preventDefault();
        const titulo = document.getElementById('titulo').value.trim();
        if (!titulo) {
          alert("Por favor, digite o título do livro!");
          return;
        }

        const totalPaginas = parseInt(document.getElementById('totalPaginas').value) || 0;
        let paginaAtual = parseInt(document.getElementById('paginaAtual').value) || 0;
        let categoria = document.getElementById('categoria').value;

        if (paginaAtual >= totalPaginas && totalPaginas > 0) {
          categoria = 'Concluídos';
        }

        const livro = {
          id: Date.now(),
          titulo: titulo,
          autor: document.getElementById('autor').value.trim() || 'Desconhecido',
          genero: document.getElementById('genero').value.trim() || 'Geral',
          totalPaginas: totalPaginas,
          paginaAtual: paginaAtual,
          categoria: categoria,
          capaUrl: capaBase64Temp
        };

        biblioteca.push(livro);
        salvar();

        document.getElementById('titulo').value = '';
        document.getElementById('autor').value = '';
        document.getElementById('genero').value = '';
        document.getElementById('totalPaginas').value = '';
        document.getElementById('paginaAtual').value = '';
        document.getElementById('capaArquivo').value = '';
        capaBase64Temp = '';
      });

      // FILTROS
      const btnsFiltro = document.querySelectorAll('.filter-btn');
      btnsFiltro.forEach(function(btn) {
        btn.addEventListener('click', function() {
          btnsFiltro.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          categoriaAtual = this.getAttribute('data-cat');
          renderizar();
        });
      });

      // PESQUISA
      document.getElementById('busca').addEventListener('input', renderizar);

      // METAS
      document.getElementById('btn-metas').addEventListener('click', function() {
        const m = prompt("Meta Mensal (livros):", metas.mensal);
        const a = prompt("Meta Anual (livros):", metas.anual);
        if (m) metas.mensal = parseInt(m) || 1;
        if (a) metas.anual = parseInt(a) || 1;
        localStorage.setItem('estante_metas_v4', JSON.stringify(metas));
        renderizar();
      });

      // MODAL FECHAR
      document.getElementById('btn-fechar-modal').addEventListener('click', function() {
        document.getElementById('modalLivro').classList.remove('active');
      });

      // SALVAR EDIÇÃO
      document.getElementById('btn-salvar-edicao').addEventListener('click', function() {
        const id = Number(document.getElementById('mod-id').value);
        const l = biblioteca.find(item => item.id === id);
        
        if (l) {
          l.titulo = document.getElementById('mod-titulo').value;
          l.autor = document.getElementById('mod-autor').value;
          l.genero = document.getElementById('mod-genero').value;
          l.totalPaginas = parseInt(document.getElementById('mod-total').value) || 0;
          l.paginaAtual = parseInt(document.getElementById('mod-atual').value) || 0;
          l.categoria = document.getElementById('mod-categoria').value;

          const fileInput = document.getElementById('mod-capaArquivo');
          if (fileInput.files && fileInput.files[0]) {
            comprimirImagem(fileInput.files[0], function(base64) {
              l.capaUrl = base64;
              salvar();
              document.getElementById('modalLivro').classList.remove('active');
            });
          } else {
            salvar();
            document.getElementById('modalLivro').classList.remove('active');
          }
        }
      });

      // EXCLUIR
      document.getElementById('btn-excluir-modal').addEventListener('click', function() {
        const id = Number(document.getElementById('mod-id').value);
        biblioteca = biblioteca.filter(l => l.id !== id);
        salvar();
        document.getElementById('modalLivro').classList.remove('active');
      });

      function salvar() {
        try {
          localStorage.setItem('estante_v4', JSON.stringify(biblioteca));
        } catch(e) {
          alert("A memória local está cheia. Tente remover alguns livros antigos.");
        }
        renderizar();
      }

      function renderizar() {
        const lista = document.getElementById('lista-livros');
        const termo = document.getElementById('busca').value.toLowerCase();
        lista.innerHTML = '';

        let totalPaginas = 0;
        let lendoCount = 0;
        let concluidosCount = 0;

        biblioteca.forEach(l => {
          totalPaginas += l.paginaAtual;
          if (l.categoria === 'Lendo') lendoCount++;
          if (l.categoria === 'Concluídos') concluidosCount++;
        });

        const filtrados = biblioteca.filter(l => {
          const catOk = categoriaAtual === 'todos' || l.categoria === categoriaAtual;
          const buscaOk = l.titulo.toLowerCase().includes(termo) || l.autor.toLowerCase().includes(termo);
          return catOk && buscaOk;
        });

        filtrados.forEach(l => {
          const pct = l.totalPaginas > 0 ? Math.min(100, Math.round((l.paginaAtual / l.totalPaginas) * 100)) : 0;
          
          const capaHTML = l.capaUrl 
            ? `<img src="${l.capaUrl}" class="book-cover">`
            : `<div class="book-cover" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:0.6rem;color:#c89f68;">${l.titulo}</div>`;

          const card = document.createElement('div');
          card.className = 'book-card';
          card.innerHTML = `
            ${capaHTML}
            <div class="book-info">
              <div class="book-title-item">${l.titulo}</div>
              <div class="book-author">${l.autor}</div>
              <div class="book-genre">${l.genero} • <b style="color:var(--text-muted);">${l.categoria}</b></div>
