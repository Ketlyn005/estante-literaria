<script>
  let biblioteca = JSON.parse(localStorage.getItem('minha_estante_livros')) || [];

  async function buscarCapaAuto() {
    const titulo = document.getElementById('titulo').value.trim();
    if (!titulo) return;

    try {
      const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(titulo)}`);
      const data = await response.json();

      if (data.items && data.items.length > 0) {
        const info = data.items[0].volumeInfo;
        
        // Trata e força o link da imagem para HTTPS
        if (info.imageLinks) {
          let urlCapa = info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '';
          urlCapa = urlCapa.replace('http://', 'https://');
          document.getElementById('capaUrl').value = urlCapa;
        }

        if (info.authors && info.authors.length > 0) {
          document.getElementById('autor').value = info.authors.join(', ');
        }
        if (info.pageCount) {
          document.getElementById('totalPaginas').value = info.pageCount;
        }
      }
    } catch (e) {
      console.log('Erro na busca da capa:', e);
    }
  }

  function adicionarLivro() {
    const titulo = document.getElementById('titulo').value.trim();
    const autor = document.getElementById('autor').value.trim() || 'Autor Desconhecido';
    const totalPaginas = parseInt(document.getElementById('totalPaginas').value) || 0;
    const paginaAtual = parseInt(document.getElementById('paginaAtual').value) || 0;
    const capaUrl = document.getElementById('capaUrl').value.trim();

    if (!titulo) {
      alert('Por favor, informe o título do livro.');
      return;
    }

    const novoLivro = {
      id: Date.now(),
      titulo,
      autor,
      totalPaginas,
      paginaAtual,
      capaUrl
    };

    biblioteca.push(novoLivro);
    salvarEAtualizar();

    // Limpa os campos após adicionar
    document.getElementById('titulo').value = '';
    document.getElementById('autor').value = '';
    document.getElementById('totalPaginas').value = '';
    document.getElementById('paginaAtual').value = '';
    document.getElementById('capaUrl').value = '';
  }

  function removerLivro(id) {
    biblioteca = biblioteca.filter(l => l.id !== id);
    salvarEAtualizar();
  }

  function salvarEAtualizar() {
    localStorage.setItem('minha_estante_livros', JSON.stringify(biblioteca));
    renderizar();
  }

  function renderizar() {
    const lista = document.getElementById('lista-livros');
    lista.innerHTML = '';

    let totalPaginasLidas = 0;
    let concluidos = 0;

    biblioteca.forEach(livro => {
      totalPaginasLidas += livro.paginaAtual;
      if (livro.paginaAtual >= livro.totalPaginas && livro.totalPaginas > 0) {
        concluidos++;
      }

      const pct = livro.totalPaginas > 0 ? Math.min(100, Math.round((livro.paginaAtual / livro.totalPaginas) * 100)) : 0;

      // Se não houver capa encontrada, cria uma capa com design elegante
      const imagemHTML = livro.capaUrl 
        ? `<img src="${livro.capaUrl}" class="book-cover" alt="Capa" onerror="this.onerror=null; this.src='https://placehold.co/110x160/241c18/c89f68?text=${encodeURIComponent(livro.titulo)}';">`
        : `<div class="book-cover" style="display:flex; align-items:center; justify-content:center; text-align:center; padding:4px; font-size:0.65rem; background:#1a1310; color:#c89f68; border:1px solid #362923;">${livro.titulo}</div>`;

      lista.innerHTML += `
        <div class="book-card">
          ${imagemHTML}
          <div class="book-info">
            <div class="book-title-item">${livro.titulo}</div>
            <div class="book-author">${livro.autor}</div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%"></div>
            </div>
            <div class="book-stats">
              <span>${livro.paginaAtual} / ${livro.totalPaginas} pág. (${pct}%)</span>
              <button class="btn-delete" onclick="removerLivro(${livro.id})">Excluir</button>
            </div>
          </div>
        </div>
      `;
    });

    // Atualiza os indicadores de estatísticas
    document.getElementById('stat-paginas').innerText = totalPaginasLidas;
    document.getElementById('stat-livros').innerText = biblioteca.length;
    document.getElementById('stat-concluidos').innerText = concluidos;
    document.getElementById('stat-mes').innerText = totalPaginasLidas;
  }

  // Carrega a estante ao abrir a página
  renderizar();
        </script>
