<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estante Literária</title>
  
  <style>
    :root {
      --bg-dark: #120e0c;
      --card-bg: #221a16;
      --card-border: #362923;
      --input-bg: #1a1310;
      --text-main: #eae4dc;
      --text-muted: #a6988a;
      --accent-gold: #c89f68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .hero-banner {
      height: 180px;
      background-image: linear-gradient(to bottom, rgba(18, 14, 12, 0.4), rgba(18, 14, 12, 0.95)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      margin-bottom: 20px;
    }

    .hero-subtitle { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-gold); font-weight: 600; }
    .hero-title { font-family: Georgia, serif; font-size: 1.8rem; font-weight: 700; color: #fff; margin-top: 4px; }

    .container { max-width: 500px; margin: 0 auto; padding: 0 16px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin-top: 4px; }

    .metas-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .meta-item { margin-bottom: 10px; }
    .meta-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }

    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background: var(--accent-gold); color: #120e0c; font-weight: 700; border-color: var(--accent-gold); }

    .form-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; margin-bottom: 24px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    input[type="text"], input[type="number"], select, input[type="file"] {
      width: 100%; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 0.85rem; outline: none;
    }

    input[type="file"]::file-selector-button {
      background: var(--card-border);
      color: var(--accent-gold);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    button, input[type="button"] { cursor: pointer; touch-action: manipulation; }
    .btn-submit { width: 100%; background-color: var(--accent-gold); color: #120e0c; border: none; border-radius: 8px; padding: 14px; font-weight: 700; font-size: 0.95rem; margin-top: 10px; display: block; text-align: center; }

    .books-grid { display: flex; flex-direction: column; gap: 12px; }
    .book-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; display: flex; gap: 12px; }
    .book-cover { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background-color: var(--input-bg); flex-shrink: 0; }
    .book-info { flex: 1; min-width: 0; }
    .book-title-item { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .book-author { font-size: 0.8rem; color: var(--text-muted); }
    .book-genre { font-size: 0.7rem; color: var(--accent-gold); margin-bottom: 6px; }

    .progress-bar { height: 6px; background-color: var(--input-bg); border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .progress-fill { height: 100%; background-color: var(--accent-gold); width: 0%; }

    .book-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-action { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); font-size: 0.75rem; padding: 8px 12px; border-radius: 6px; }
    .btn-action.accent { border-color: var(--accent-gold); color: var(--accent-gold); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; padding: 20px; overflow-y: auto; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.6rem; }
  </style>
</head>
<body>

  <div class="hero-banner">
    <div class="container" style="padding:0; width:100%;">
      <span class="hero-subtitle">Sua Biblioteca Pessoal</span>
      <h1 class="hero-title">Estante Literária</h1>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Páginas Lidas</div><div class="stat-value" id="stat-paginas">0</div></div>
      <div class="stat-card"><div class="stat-label">Em Andamento</div><div class="stat-value" id="stat-lendo">0</div></div>
      <div class="stat-card"><div class="stat-label">Livros Concluídos</div><div class="stat-value" id="stat-concluidos">0</div></div>
      <div class="stat-card"><div class="stat-label">Total Cadastrado</div><div class="stat-value" id="stat-total">0</div></div>
    </div>

    <div class="metas-card">
      <div class="meta-item">
        <div class="meta-header"><span>Meta Mensal</span><span id="meta-m-texto">0/0 livros</span></div>
        <div class="progress-bar"><div class="progress-fill" id="meta-m-bar"></div></div>
      </div>
      <div class="meta-item" style="margin-top:10px;">
        <div class="meta-header"><span>Meta Anual</span><span id="meta-a-texto">0/0 livros</span></div>
        <div class="progress-bar"><div class="progress-fill" id="meta-a-bar"></div></div>
      </div>
      <button class="btn-action accent" style="width:100%; margin-top:10px;" type="button" onclick="definirMetas()">Ajustar Metas</button>
    </div>

    <input type="text" id="busca" placeholder="🔎 Pesquisar livro ou autor..." style="margin-bottom: 12px;" oninput="renderizar()">
    
    <div class="filter-scroll">
      <button class="filter-btn active" type="button" onclick="filtrar('todos', this)">Todos</button>
      <button class="filter-btn" type="button" onclick="filtrar('Lendo', this)">Lendo</button>
      <button class="filter-btn" type="button" onclick="filtrar('Quero ler', this)">Quero ler</button>
      <button class="filter-btn" type="button" onclick="filtrar('Concluídos', this)">Concluídos</button>
      <button class="filter-btn" type="button" onclick="filtrar('Pausados', this)">Pausados</button>
      <button class="filter-btn" type="button" onclick="filtrar('Abandonados', this)">Abandonados</button>
    </div>

    <div class="form-card">
      <h2 style="font-family:Georgia, serif; font-size:1rem; margin-bottom:12px;">Cadastrar Novo Livro</h2>
      
      <div class="form-group">
        <label>Título *</label>
        <input type="text" id="titulo" placeholder="Ex.: O Cemitério" onblur="buscarCapaGoogle()">
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Autor</label>
          <input type="text" id="autor" placeholder="Nome do autor">
        </div>
        <div class="form-group">
          <label>Gênero</label>
          <input type="text" id="genero" placeholder="Ex.: Terror, Romance">
        </div>
      </div>

      <div class="input-row">
        <div class="form-group">
          <label>Total Páginas</label>
          <input type="number" id="totalPaginas" placeholder="320">
        </div>
        <div class="form-group">
          <label>Página Atual</label>
          <input type="number" id="paginaAtual" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>Status / Categoria</label>
        <select id="categoria">
          <option value="Quero ler">Quero ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausados">Pausados</option>
          <option value="Abandonados">Abandonados</option>
          <option value="Concluídos">Concluídos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Escolher Capa da Galeria</label>
        <input type="file" id="capaArquivo" accept="image/*" onchange="processarCapaGaleria(this)">
      </div>

      <button type="button" class="btn-submit" onclick="adicionarLivro()">Adicionar à Estante</button>
    </div>

    <h2 style="font-family:Georgia, serif; font-size:1.1rem; margin-bottom:12px;">Meus Livros</h2>
    <div class="books-grid" id="lista-livros"></div>
  </div>

  <!-- MODAL EDIÇÃO -->
  <div class="modal" id="modalLivro">
    <div class="modal-content">
      <button class="close-modal" type="button" onclick="fecharModal()">&times;</button>
      <h3 style="font-family:Georgia, serif; margin-bottom:12px;">Editar / Detalhes</h3>
      
      <input type="hidden" id="mod-id">
      
      <div class="form-group"><label>Título</label><input type="text" id="mod-titulo"></div>
      <div class="input-row">
        <div class="form-group"><label>Autor</label><input type="text" id="mod-autor"></div>
        <div class="form-group"><label>Gênero</label><input type="text" id="mod-genero"></div>
      </div>
      
      <div class="input-row">
        <div class="form-group"><label>Total Páginas</label><input type="number" id="mod-total"></div>
        <div class="form-group"><label>Página Atual</label><input type="number" id="mod-atual"></div>
      </div>

      <div class="form-group">
        <label>Status / Categoria</label>
        <select id="mod-categoria">
          <option value="Quero ler">Quero ler</option>
          <option value="Lendo">Lendo</option>
          <option value="Pausados">Pausados</option>
          <option value="Abandonados">Abandonados</option>
          <option value="Concluídos">Concluídos</option>
        </select>
      </div>

      <div class="form-group">
        <label>Trocar Capa pela Galeria</label>
        <input type="file" id="mod-capaArquivo" accept="image/*" onchange="processarCapaModal(this)">
      </div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn-submit" onclick="salvarEdicaoModal()">Salvar Alterações</button>
        <button type="button" class="btn-submit" style="background:#8a3b3b; color:#fff;" onclick="excluirLivroModal()">Excluir Livro</button>
      </div>
    </div>
  </div>

  <script>
    var biblioteca = [];
    var metas = { mensal: 2, anual: 24 };
    var categoriaFiltro = 'todos';
    var capaTemp = '';
    var capaModalTemp = '';

    window.onload = function() {
      try {
        var dadosSalvos = localStorage.getItem('estante_v_final');
        if (dadosSalvos) biblioteca = JSON.parse(dadosSalvos);
        
        var metasSalvas = localStorage.getItem('metas_v_final');
        if (metasSalvas) metas = JSON.parse(metasSalvas);
      } catch(e) {
        biblioteca = [];
      }
      renderizar();
    };

    function comprimirFoto(file, callback) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var maxDim = 200;
          var w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
          else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.5));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processarCapaGaleria(input) {
      if (input.files && input.files[0]) {
        comprimirFoto(input.files[0], function(res) {
          capaTemp = res;
        });
      }
    }

    function processarCapaModal(input) {
      if (input.files && input.files[0]) {
        comprimirFoto(input.files[0], function(res) {
          capaModalTemp = res;
        });
      }
    }

    function buscarCapaGoogle() {
      var t = document.getElementById('titulo').value.trim();
      if (!t || capaTemp) return;
      
      fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(t))
        .then(function(res) { return res.json(); })
        .then(function(d) {
          if (d.items && d.items[0]) {
            var info = d.items[0].volumeInfo;
            if (info.imageLinks && info.imageLinks.thumbnail) {
              capaTemp = info.imageLinks.thumbnail.replace('http://', 'https://');
            }
            if (info.authors && !document.getElementById('autor').value) {
              document.getElementById('autor').value = info.authors.join(', ');
            }
            if (info.pageCount && !document.getElementById('totalPaginas').value) {
              document.getElementById('totalPaginas').value = info.pageCount;
            }
          }
        }).catch(function(e){});
    }

    function adicionarLivro() {
      var campoTitulo = document.getElementById('titulo');
      var titulo = campoTitulo.value.trim();
      
      if (!titulo) {
        alert("Por favor, preencha o título do livro!");
        return;
      }

      var total = parseInt(document.getElementById('totalPaginas').value) || 0;
      var atual = parseInt(document.getElementById('paginaAtual').value) || 0;
      var cat = document.getElementById('categoria').value;

      if (atual >= total && total > 0) cat = 'Concluídos';

      var novo = {
        id: new Date().getTime(),
        titulo: titulo,
        autor: document.getElementById('autor').value.trim() || 'Desconhecido',
        genero: document.getElementById('genero').value.trim() || 'Geral',
        totalPaginas: total,
        paginaAtual: atual,
        categoria: cat,
        capaUrl: capaTemp
      };

      biblioteca.push(novo);
      salvar();

      // Limpeza dos campos
      document.getElementById('titulo').value = '';
      document.getElementById('autor').value = '';
      document.getElementById('genero').value = '';
      document.getElementById('totalPaginas').value = '';
      document.getElementById('paginaAtual').value = '';
      document.getElementById('capaArquivo').value = '';
      capaTemp = '';

      alert("Livro adicionado!");
    }

    function filtrar(cat, btn) {
      categoriaFiltro = cat;
      var btns = document.querySelectorAll('.filter-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      if (btn) btn.classList.add('active');
      renderizar();
    }

    function definirMetas() {
      var m = prompt("Meta Mensal de livros:", metas.mensal);
      var a = prompt("Meta Anual de livros:", metas.anual);
      if (m) metas.mensal = parseInt(m) || 1;
      if (a) metas.anual = parseInt(a) || 1;
      localStorage.setItem('metas_v_final', JSON.stringify(metas));
      renderizar();
    }

    function abrirModal(id) {
      var l = null;
      for (var i = 0; i < biblioteca.length; i++) {
        if (biblioteca[i].id === id) { l = biblioteca[i]; break; }
      }
      if (!l) return;

      document.getElementById('mod-id').value = l.id;
      document.getElementById('mod-titulo').value = l.titulo;
      document.getElementById('mod-autor').value = l.autor;
      document.getElementById('mod-genero').value = l.genero;
      document.getElementById('mod-total').value = l.totalPaginas;
      document.getElementById('mod-atual').value = l.paginaAtual;
      document.getElementById('mod-categoria').value = l.categoria;
      capaModalTemp = l.capaUrl;
      document.getElementById('modalLivro').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modalLivro').classList.remove('active');
    }

    function salvarEdicaoModal() {
      var id = Number(document.getElementById('mod-id').value);
      var l = null;
      for (var i = 0; i < biblioteca.length; i++) {
        if (biblioteca[i].id === id) { l = biblioteca[i]; break; }
      }

      if (l) {
        l.titulo = document.getElementById('mod-titulo').value;
        l.autor = document.getElementById('mod-autor').value;
        l.genero = document.getElementById('mod-genero').value;
        l.totalPaginas = parseInt(document.getElementById('mod-total').value) || 0;
        l.paginaAtual = parseInt(document.getElementById('mod-atual').value) || 0;
        l.categoria = document.getElementById('mod-categoria').value;
        l.capaUrl = capaModalTemp;
        if (l.paginaAtual >= l.totalPaginas && l.totalPaginas > 0) l.categoria = 'Concluídos';
        salvar();
        fecharModal();
      }
    }

    function excluirLivroModal() {
      var id = Number(document.getElementById('mod-id').value);
      var novaBib = [];
      for (var i = 0; i < biblioteca.length; i++) {
        if (biblioteca[i].id !== id) novaBib.push(biblioteca[i]);
      }
      biblioteca = novaBib;
      salvar();
      fecharModal();
    }

    function avancarPagina(id) {
      for (var i = 0; i < biblioteca.length; i++) {
        if (biblioteca[i].id === id) {
          if (biblioteca[i].paginaAtual < biblioteca[i].totalPaginas) {
            biblioteca[i].paginaAtual++;
            if (biblioteca[i].paginaAtual >= biblioteca[i].totalPaginas) biblioteca[i].categoria = 'Concluídos';
            salvar();
          }
          break;
        }
      }
    }

    function salvar() {
      try {
        localStorage.setItem('estante_v_final', JSON.stringify(biblioteca));
      } catch(e) {
        alert("Erro ao salvar: Memória cheia!");
      }
      renderizar();
    }

    function renderizar() {
      var lista = document.getElementById('lista-livros');
      var termo = document.getElementById('busca').value.toLowerCase();
      lista.innerHTML = '';

      var paginasTotais = 0, emAndamento = 0, concluidos = 0;

      for (var i = 0; i < biblioteca.length; i++) {
        var item = biblioteca[i];
        paginasTotais += item.paginaAtual;
        if (item.categoria === 'Lendo') emAndamento++;
        if (item.categoria === 'Concluídos') concluidos++;
      }

      for (var j = 0; j < biblioteca.length; j++) {
        var l = biblioteca[j];
        var cOk = categoriaFiltro === 'todos' || l.categoria === categoriaFiltro;
        var bOk = l.titulo.toLowerCase().indexOf(termo) !== -1 || l.autor.toLowerCase().indexOf(termo) !== -1;

        if (cOk && bOk) {
          var pct = l.totalPaginas > 0 ? Math.min(100, Math.round((l.paginaAtual / l.totalPaginas) * 100)) : 0;
          var capaHtml = l.capaUrl 
            ? '<img src="' + l.capaUrl + '" class="book-cover">'
